# Auto-release com.zoreal:oauth2 on every push to main, the family pattern set
# by zoreal-oauth2-react: bump the patch in the pom, run the tests, deploy to
# Maven Central through the Central Portal, push the bump commit and tag back
# to main, and cut the GitHub release. The push back uses the default
# GITHUB_TOKEN, which does not retrigger this workflow, and the bump commit
# carries [skip publish] as a second guard.
#
# To ship without cutting a release (docs, CI tweaks), put [skip publish] in
# the commit message.
#
# Needs four secrets, all from the one-time Maven Central setup:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  the Central Portal token
#     pair (central.sonatype.com -> Account -> Generate User Token), valid for
#     the verified com.zoreal namespace.
#   GPG_PRIVATE_KEY  an armored private key (gpg --armor --export-secret-keys)
#     whose public half is on keyserver.ubuntu.com; Central verifies the
#     signatures against it.
#   GPG_PASSPHRASE   its passphrase.
name: Publish to Maven Central

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    environment: maven-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          NEW="${CURRENT%.*}.$(( ${CURRENT##*.} + 1 ))"
          mvn -q versions:set -DnewVersion="${NEW}" -DgenerateBackupPoms=false
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - run: mvn -B verify

      - run: |
          git add pom.xml
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip publish]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - run: mvn -B -P release deploy -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - run: gh release create "v${{ steps.bump.outputs.version }}" --title "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
